name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "CLOUDFLARE_ACCOUNT_ID set: $([ -n \"$CLOUDFLARE_ACCOUNT_ID\" ] && echo yes || echo no)"
          echo "CLOUDFLARE_API_TOKEN set: $([ -n \"$CLOUDFLARE_API_TOKEN\" ] && echo yes || echo no)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          [ -n "$CLOUDFLARE_API_TOKEN" ] || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)

      - name: Generate wrangler.toml
        env:
          ROUTES_CONFIG: ${{ vars.ROUTES_CONFIG }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, pathlib, sys, re

          routes = os.environ.get("ROUTES_CONFIG", "").strip()
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()

          if not account_id:
              sys.exit("GitHub Secret CLOUDFLARE_ACCOUNT_ID is empty or missing.")

          if routes:
              try:
                  json.loads(routes)
              except Exception as e:
                  sys.exit(f"ROUTES_CONFIG is not valid JSON: {e}")

              routes_as_toml_string = json.dumps(routes)

              pathlib.Path("wrangler.toml").write_text(f'''name = "ai-worker-proxy"
              account_id = "{account_id}"
              main = "src/index.ts"
              compatibility_date = "2024-01-01"

              [ai]
              binding = "AI"

              [observability]
              [observability.logs]
              enabled = true
              head_sampling_rate = 1
              invocation_logs = true
              persist = false

              [vars]
              ROUTES_CONFIG = {routes_as_toml_string}
              ''')
          else:
              wrangler_toml = pathlib.Path("wrangler.toml")
              if not wrangler_toml.exists():
                  sys.exit("wrangler.toml not found and GitHub Variable ROUTES_CONFIG is empty.")

              content = wrangler_toml.read_text()
              if "account_id" not in content:
                  content = re.sub(
                      r'^name\s*=\s*"ai-worker-proxy"\s*$',
                      f'name = "ai-worker-proxy"\\naccount_id = "{account_id}"',
                      content,
                      count=1,
                      flags=re.M,
                  )
                  wrangler_toml.write_text(content)

              content = wrangler_toml.read_text()
              match = re.search(r"ROUTES_CONFIG\s*=\s*'''(.*?)'''", content, re.S)
              if not match:
                  sys.exit("GitHub Variable ROUTES_CONFIG is empty and wrangler.toml does not contain a ROUTES_CONFIG example.")

              fallback_routes = match.group(1).strip()
              try:
                  json.loads(fallback_routes)
              except Exception as e:
                  sys.exit(f"Fallback ROUTES_CONFIG in wrangler.toml is not valid JSON: {e}")

              print("GitHub Variable ROUTES_CONFIG is empty. Falling back to repository wrangler.toml config.")
          PY

          echo "Using wrangler.toml:"
          cat wrangler.toml

          pnpm exec wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
