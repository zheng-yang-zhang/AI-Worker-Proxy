name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.toml
        env:
          ROUTES_CONFIG: ${{ vars.ROUTES_CONFIG }}
        run: |
          python3 - <<'PY'
          import os, json, pathlib, sys

          routes = os.environ.get("ROUTES_CONFIG", "").strip()
          if not routes:
              sys.exit("GitHub Variable ROUTES_CONFIG is empty. Please set it in Settings → Secrets and variables → Actions → Variables.")

          try:
              json.loads(routes)
          except Exception as e:
              sys.exit(f"ROUTES_CONFIG is not valid JSON: {e}")

          routes_as_toml_string = json.dumps(routes)

          pathlib.Path("wrangler.toml").write_text(f'''name = "ai-worker-proxy"
          main = "src/index.ts"
          compatibility_date = "2024-01-01"

          [ai]
          binding = "AI"

          [observability]
          [observability.logs]
          enabled = true
          head_sampling_rate = 1
          invocation_logs = true
          persist = false

          [vars]
          ROUTES_CONFIG = {routes_as_toml_string}
          ''')
          PY

          echo "Generated wrangler.toml:"
          cat wrangler.toml

          pnpm exec wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
